name: build-and-test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore Wpk.slnx --locked-mode

      - name: Release tests
        run: dotnet test Wpk.slnx -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results

      # Publish must restore: PublishSingleFile needs the win-x64 runtime pack
      # (NETSDK1112 if solution restore alone is reused with --no-restore).
      - name: Publish x64 framework-dependent single-file
        run: >
          dotnet publish src/Wpk.Cli -c Release -r win-x64 --self-contained false
          -o artifacts/wpk-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Check published executable and package
        id: meta
        shell: pwsh
        run: |
          & .\artifacts\wpk-win-x64\wpk.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Published executable failed' }

          $version = (& .\artifacts\wpk-win-x64\wpk.exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Failed to read published version: $version"
          }

          $name = "wpk-$version-win-x64"
          $exeName = "$name.exe"
          Copy-Item -Path artifacts/wpk-win-x64/wpk.exe -Destination "artifacts/$exeName" -Force

          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$name" >> $env:GITHUB_OUTPUT
          "exe=$exeName" >> $env:GITHUB_OUTPUT

      - name: Upload CLI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: artifacts/${{ steps.meta.outputs.exe }}
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7
