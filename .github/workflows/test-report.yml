name: test-report

on:
  workflow_run:
    workflows: [build-and-test]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - uses: dorny/test-reporter@v3.2.0
        with:
          artifact: test-results
          name: Test Results
          path: '*.trx'
          reporter: dotnet-trx
          list-suites: all
          list-tests: failed
