name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # AOT native link is slower than single-file publishes; keep headroom for four variants.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Resolve version from tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag must match vX.Y.Z (e.g. v1.0.0), got: $tag"
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore locked dependencies
        run: dotnet restore Wpk.slnx --locked-mode

      - name: Release tests
        run: dotnet test Wpk.slnx -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results

      # Publish must restore: PublishSingleFile / self-contained need the win-x64
      # runtime pack (NETSDK1112 if solution restore alone is reused with --no-restore).
      - name: Publish framework-dependent single-file
        run: >
          dotnet publish src/Wpk.Cli -c Release -r win-x64 --self-contained false
          -o artifacts/publish/fd
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false

      # PublishTrimmed is self-contained-only (NETSDK1102 for FD). TrimMode=partial is set in Wpk.Cli.csproj.
      - name: Publish self-contained single-file
        run: >
          dotnet publish src/Wpk.Cli -c Release -r win-x64 --self-contained true
          -o artifacts/publish/sc
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Publish ReadyToRun self-contained single-file
        run: >
          dotnet publish src/Wpk.Cli -c Release -r win-x64 --self-contained true
          -o artifacts/publish/r2r
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false

      # windows-latest includes VS MSVC for the Native AOT platform linker.
      # WinGet ComInterop ships Microsoft.Management.Deployment.dll beside the AOT
      # binary (static factory linkage); package both in a zip for a usable inventory.
      - name: Publish Native AOT
        run: >
          dotnet publish src/Wpk.Cli -c Release -r win-x64 --self-contained true
          -o artifacts/publish/aot
          -p:PublishAot=true
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Stage release binaries and SHA256
        id: meta
        shell: pwsh
        run: |
          $expected = '${{ steps.tag.outputs.version }}'
          $variants = @(
            @{ Dir = 'fd';  Suffix = '';    Kind = 'exe' },
            @{ Dir = 'sc';  Suffix = '-sc'; Kind = 'exe' },
            @{ Dir = 'r2r'; Suffix = '-r2r'; Kind = 'exe' },
            @{ Dir = 'aot'; Suffix = '-aot'; Kind = 'zip' }
          )

          $staged = [System.Collections.Generic.List[string]]::new()
          foreach ($v in $variants) {
            $src = "artifacts/publish/$($v.Dir)/wpk.exe"
            if (-not (Test-Path $src)) { throw "Missing published exe: $src" }

            $reported = (& $src --version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Published executable failed ($($v.Dir)): $reported" }
            if ($reported -ne $expected) {
              throw "Published version mismatch ($($v.Dir)). Expected '$expected' from tag, got: $reported"
            }

            if ($v.Kind -eq 'zip') {
              $dll = "artifacts/publish/$($v.Dir)/Microsoft.Management.Deployment.dll"
              if (-not (Test-Path $dll)) {
                throw "Missing WinGet projection DLL for AOT package: $dll"
              }

              $stageDir = 'artifacts/stage-aot'
              if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
              New-Item -ItemType Directory -Path $stageDir | Out-Null
              Copy-Item -Path $src -Destination (Join-Path $stageDir 'wpk.exe') -Force
              Copy-Item -Path $dll -Destination (Join-Path $stageDir 'Microsoft.Management.Deployment.dll') -Force

              $name = "wpk-$reported-win-x64$($v.Suffix).zip"
              $dest = "artifacts/$name"
              if (Test-Path $dest) { Remove-Item $dest -Force }
              Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $dest -Force
              $staged.Add($name)
              Write-Host "Staged $name ($([math]::Round((Get-Item $dest).Length / 1MB, 2)) MB)"
            }
            else {
              $name = "wpk-$reported-win-x64$($v.Suffix).exe"
              $dest = "artifacts/$name"
              Copy-Item -Path $src -Destination $dest -Force
              $staged.Add($name)
              Write-Host "Staged $name ($([math]::Round((Get-Item $dest).Length / 1MB, 2)) MB)"
            }
          }

          $sumsPath = 'artifacts/SHA256SUMS.txt'
          $lines = foreach ($name in $staged) {
            $hash = (Get-FileHash -Path "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          Set-Content -Path $sumsPath -Value ($lines -join "`n") -NoNewline -Encoding utf8
          Write-Host "`nSHA256SUMS.txt:"
          $lines | ForEach-Object { Write-Host $_ }

          "version=$expected" >> $env:GITHUB_OUTPUT
          "artifact=wpk-$expected-win-x64" >> $env:GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            artifacts/wpk-${{ steps.meta.outputs.version }}-win-x64.exe
            artifacts/wpk-${{ steps.meta.outputs.version }}-win-x64-sc.exe
            artifacts/wpk-${{ steps.meta.outputs.version }}-win-x64-r2r.exe
            artifacts/wpk-${{ steps.meta.outputs.version }}-win-x64-aot.zip
            artifacts/SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Downloads (win-x64)

            | Asset | Mode | Notes |
            | --- | --- | --- |
            | `wpk-${{ steps.tag.outputs.version }}-win-x64.exe` | Framework-dependent | Requires [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0); no IL trim (SDK limit) |
            | `wpk-${{ steps.tag.outputs.version }}-win-x64-sc.exe` | Self-contained + trimmed | Bundles the .NET runtime; single-file compression |
            | `wpk-${{ steps.tag.outputs.version }}-win-x64-r2r.exe` | Self-contained + trimmed + ReadyToRun | Faster startup; larger than `-sc` |
            | `wpk-${{ steps.tag.outputs.version }}-win-x64-aot.zip` | Native AOT | Native binary + `Microsoft.Management.Deployment.dll` (keep both together); no .NET runtime required |
            | `SHA256SUMS.txt` | Checksums | SHA-256 for each downloadable asset |

            Prefer `-sc` for a simple single-file install. Use `-aot` when you want native startup/size and can unzip two files into the same folder.
          files: |
            artifacts/wpk-${{ steps.tag.outputs.version }}-win-x64.exe
            artifacts/wpk-${{ steps.tag.outputs.version }}-win-x64-sc.exe
            artifacts/wpk-${{ steps.tag.outputs.version }}-win-x64-r2r.exe
            artifacts/wpk-${{ steps.tag.outputs.version }}-win-x64-aot.zip
            artifacts/SHA256SUMS.txt
